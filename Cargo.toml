[package]
name = "downbad"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "db"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
egui_commonmark = "0.22"
whisper-rs = "0.15"
cpal = "0.15"
espeak-rs = "0.1"
ort = { version = "2.0.0-rc.11", features = ["download-binaries"] }
serde_json = "1"
